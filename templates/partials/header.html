<header>
    <nav>
        <a href="/" class="nav-logo">
            <span class="logo-icon">🔔</span>
            공지봇
        </a>
        <div class="nav-actions">
            {% if is_logged_in %}
                <span class="nav-school-badge">
                    {{ current_user.school.name }}
                    {% if current_user.department %}
                        <span class="nav-dept">· {{ current_user.department.name }}</span>
                    {% endif %}
                </span>
                <a href="/notices" class="btn-ghost">공지 목록</a>
                <a href="/chat" class="btn-ghost">채팅</a>
                <a href="/logout" class="btn-nav-outline">로그아웃</a>
            {% else %}
                <a href="/login" class="btn-ghost">로그인</a>
                <a href="/register" class="btn-nav-primary">무료 시작</a>
            {% endif %}
        </div>
    </nav>
</header>
